name: Publish verified Arabic preview

on:
  push:
    tags: ['publish-arabic-v*', 'inspect-arabic-*']

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    if: startsWith(github.ref_name, 'inspect-arabic-')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Read native failure reports
        shell: bash
        run: |
          set -euo pipefail
          run="${GITHUB_REF_NAME#inspect-arabic-}"
          run="${run%%-*}"
          [[ "$run" =~ ^[0-9]+$ ]]
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --pattern 'windows-arabic-test-results' --pattern 'unix-test-results-*' --dir Reports
          python3 - <<'PYTHON'
          import pathlib, xml.etree.ElementTree as ET, os
          lines = []
          for file in pathlib.Path('Reports').rglob('*.trx'):
              root = ET.parse(file)
              lines.append(str(file) + ': ' + str(root.find('.//{*}Counters').attrib))
              for row in root.findall('.//{*}UnitTestResult'):
                  if row.get('outcome') not in ('Passed', 'NotExecuted'):
                      text = row.get('testName', '') + ': ' + ' '.join(row.itertext())
                      print('::error::' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
                      lines.append(text)
          for file in pathlib.Path('Reports').rglob('svg-model.txt'):
              lines.append(str(file) + '\n' + file.read_text(encoding='utf-8'))
          pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n\n'.join(lines), encoding='utf-8')
          PYTHON

      - name: Inspect a failed packaging job
        if: contains(github.ref_name, '-job')
        shell: bash
        run: |
          set -euo pipefail
          job="${GITHUB_REF_NAME##*-job}"
          [[ "$job" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > packaging.log
          python3 - <<'PYTHON'
          import pathlib
          text = '\n'.join(pathlib.Path('packaging.log').read_text(encoding='utf-8', errors='replace').splitlines()[-150:])
          print('::error::Packaging log: ' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYTHON

  probe:
    if: startsWith(github.ref_name, 'inspect-arabic-') && contains(github.ref_name, '-probe')
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      FILEE_ARABIC_PDF_ARTIFACTS: ${{ github.workspace }}/TestResults/arabic-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Fonts and native document engine
        run: |
          ./build/fetch-fonts.ps1
          ./build/fetch-engines.ps1 -Only rhwp,7zip,pandoc
      - name: Arabic content regression tests
        run: dotnet test tests/Filee.Engines.Tests -c Release --filter FullyQualifiedName~ArabicPdfTests --logger trx --results-directory TestResults
      - name: Public failure details
        if: always()
        run: |
          foreach ($file in Get-ChildItem TestResults -Filter *.trx -Recurse) {
            [xml]$trx = Get-Content -Raw $file.FullName
            foreach ($row in $trx.TestRun.Results.UnitTestResult) {
              if ($row.outcome -notin @('Passed','NotExecuted')) {
                $text = "$($row.testName): $($row.Output.ErrorInfo.Message) $($row.Output.ErrorInfo.StackTrace)"
                Write-Output ('::error::' + $text.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
              }
            }
          }
          if (Test-Path TestResults/arabic-pdf/svg-model.txt) {
            $trace = Get-Content -Raw TestResults/arabic-pdf/svg-model.txt
            Write-Output ('::notice::SVG trace: ' + $trace.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-pdf-probe
          path: TestResults/

  publish:
    if: startsWith(github.ref_name, 'publish-arabic-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve preview version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#publish-arabic-v}"
          version="${version%%+*}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z][0-9A-Za-z.-]*$ ]]; then
            echo 'Only a valid prerelease version can be published by this workflow.' >&2
            exit 1
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=arabic-v$version" >> "$GITHUB_ENV"
      - name: Require a successful build of the release source
        shell: bash
        run: |
          set -euo pipefail
          source_commit=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
          if [[ ! "$source_commit" =~ ^[a-f0-9]{40}$ ]]; then
            echo 'The preview must target an exact source commit.' >&2
            exit 1
          fi
          source_run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/arabic-builds.yml/runs?head_sha=$source_commit&status=success&per_page=100" --jq '.workflow_runs[0].id // empty')
          [[ "$source_run" =~ ^[0-9]+$ ]]
          echo "SOURCE_RUN_ID=$source_run" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "Verified source commit: $source_commit" >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify all ten installers
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir Packages
          cd Packages
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do
            test -s "Filee-$PACKAGE_VERSION-$rid.tar.gz"
            sha256sum --check "Filee-$PACKAGE_VERSION-$rid-SHA256SUMS.txt"
          done
          test -s "Filee-$PACKAGE_VERSION-win-Setup.exe"
          test -s "Filee-$PACKAGE_VERSION-win-Portable.zip"
          sha256sum --check "Filee-$PACKAGE_VERSION-SHA256SUMS.txt"
          for rid in linux-x64 linux-arm64; do
            test -s "Filee-$PACKAGE_VERSION-$rid.deb"
            sha256sum --check "Filee-$PACKAGE_VERSION-$rid.deb-SHA256SUMS.txt"
          done
          for rid in osx-x64 osx-arm64; do
            test -s "Filee-$PACKAGE_VERSION-$rid.dmg"
            sha256sum --check "Filee-$PACKAGE_VERSION-$rid.dmg-SHA256SUMS.txt"
          done
          test "$(find . -maxdepth 1 -name 'Filee-*' \( -name '*.exe' -o -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.dmg' \) | wc -l)" -eq 10
          sha256sum --check SHA256SUMS.txt
      - name: Summarize native test results
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'unix-test-results-*' --pattern 'windows-arabic-test-results' --dir TestReports
          python3 build/verify-arabic-release.py
          cp VALIDATION.json Screenshots-Arabic.zip PDF-Arabic-Samples.zip Packages/
          cd Packages
          sha256sum Filee-*.exe Filee-*.zip Filee-*.tar.gz Filee-*.deb Filee-*.dmg VALIDATION.json Screenshots-Arabic.zip PDF-Arabic-Samples.zip > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" VALIDATION.json Screenshots-Arabic.zip PDF-Arabic-Samples.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --notes-file docs/ARABIC-RELEASE.md
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
